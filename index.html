<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Digital Signage Calculator</title>
    <style>
        :root {
            --primary: #00b7af;
            --dark: #10181f;
            --light: #ffffff;
            --secondary: #6a7071;
            --button-bg: #222d38;
            --button-text: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--dark);
            color: var(--light);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .calculator {
            background-color: #1a242d;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            width: 400px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .display {
            background-color: #0d141a;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: right;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            word-wrap: break-word;
            word-break: break-all;
            border: 2px solid #222d38;
        }

        .previous-operand {
            color: var(--secondary);
            font-size: 1.2rem;
            margin-bottom: 5px;
        }

        .current-operand {
            color: var(--light);
            font-size: 2.5rem;
            font-weight: bold;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        button {
            cursor: pointer;
            font-size: 1.5rem;
            border: none;
            border-radius: 12px;
            padding: 20px 0;
            background-color: var(--button-bg);
            color: var(--button-text);
            transition: all 0.2s ease;
            outline: none;
        }

        button:hover {
            background-color: #2d3b48;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .span-two {
            grid-column: span 2;
        }

        .operator {
            background-color: #2d3b48;
            color: var(--primary);
            font-weight: bold;
        }

        .operator:hover {
            background-color: #384958;
        }

        .equals {
            background-color: var(--primary);
            color: var(--dark);
            font-weight: bold;
        }

        .equals:hover {
            background-color: #00d4cc;
        }

        .clear {
            color: #ff4b4b;
        }

        .delete {
            color: #ff9f43;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div id="previous-operand" class="previous-operand"></div>
            <div id="current-operand" class="current-operand">0</div>
        </div>
        <div class="buttons">
            <button class="span-two clear" onclick="calculator.clear()">AC</button>
            <button class="delete" onclick="calculator.delete()">DEL</button>
            <button class="operator" onclick="calculator.chooseOperation('÷')">÷</button>
            <button onclick="calculator.appendNumber('1')">1</button>
            <button onclick="calculator.appendNumber('2')">2</button>
            <button onclick="calculator.appendNumber('3')">3</button>
            <button class="operator" onclick="calculator.chooseOperation('*')">×</button>
            <button onclick="calculator.appendNumber('4')">4</button>
            <button onclick="calculator.appendNumber('5')">5</button>
            <button onclick="calculator.appendNumber('6')">6</button>
            <button class="operator" onclick="calculator.chooseOperation('+')">+</button>
            <button onclick="calculator.appendNumber('7')">7</button>
            <button onclick="calculator.appendNumber('8')">8</button>
            <button onclick="calculator.appendNumber('9')">9</button>
            <button class="operator" onclick="calculator.chooseOperation('-')">-</button>
            <button onclick="calculator.appendNumber('.')">.</button>
            <button onclick="calculator.appendNumber('0')">0</button>
            <button class="span-two equals" onclick="calculator.compute()">=</button>
        </div>
    </div>

    <script src="script.js?v=a1b2c3"></script>
</body>
</html>
