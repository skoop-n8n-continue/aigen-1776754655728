<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="./manifest.json?v=x2y9z4">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Premium Digital Signage Calculator</title>
    <style>
        :root {
            --primary: #00b7af;
            --dark: #0a0f14;
            --light: #ffffff;
            --secondary: #a0a8ab;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --button-bg: rgba(255, 255, 255, 0.08);
            --button-hover: rgba(255, 255, 255, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: radial-gradient(circle at top left, #10181f, #05070a);
            color: var(--light);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
        }

        /* Decorative background elements */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 50vw;
            height: 50vw;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.15;
            animation: float 20s ease-in-out infinite alternate;
        }

        body::before {
            background: var(--primary);
            top: -10%;
            left: -10%;
        }

        body::after {
            background: #6a7071;
            bottom: -10%;
            right: -10%;
            animation-delay: -10s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(5%, 5%) scale(1.1); }
            100% { transform: translate(-5%, 2%) scale(1); }
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            width: 440px;
            padding: 0 10px;
            font-size: 0.9rem;
            color: var(--secondary);
            font-weight: 500;
        }

        .calculator {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 40px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.6);
            width: 440px;
            border: 1px solid var(--glass-border);
            animation: fadeIn 1s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .display {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 30px;
            text-align: right;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            word-wrap: break-word;
            word-break: break-all;
            border: 1px solid var(--glass-border);
        }

        .previous-operand {
            color: var(--secondary);
            font-size: 1.1rem;
            margin-bottom: 8px;
            height: 1.5rem;
        }

        .current-operand {
            color: var(--light);
            font-size: 3rem;
            font-weight: 600;
            letter-spacing: -1px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        button {
            cursor: pointer;
            font-size: 1.4rem;
            font-weight: 500;
            border: 1px solid transparent;
            border-radius: 16px;
            padding: 24px 0;
            background: var(--button-bg);
            color: var(--light);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button:hover {
            background: var(--button-hover);
            border-color: var(--glass-border);
            transform: scale(1.02);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        button:active {
            transform: scale(0.95);
        }

        .span-two {
            grid-column: span 2;
        }

        .operator {
            background: rgba(0, 183, 175, 0.1);
            color: var(--primary);
            font-weight: 600;
            font-size: 1.6rem;
        }

        .operator:hover {
            background: rgba(0, 183, 175, 0.2);
        }

        .equals {
            background: var(--primary);
            color: var(--dark);
            font-weight: 700;
            font-size: 1.8rem;
        }

        .equals:hover {
            background: #00d4cc;
            box-shadow: 0 0 20px rgba(0, 183, 175, 0.4);
        }

        .clear {
            color: #ff5e5e;
            background: rgba(255, 94, 94, 0.1);
        }

        .clear:hover {
            background: rgba(255, 94, 94, 0.2);
        }

        .delete {
            color: #ffb142;
            background: rgba(255, 177, 66, 0.1);
        }

        .delete:hover {
            background: rgba(255, 177, 66, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="info-bar">
            <div id="date"></div>
            <div id="time"></div>
        </div>
        <div class="calculator">
            <div class="display">
                <div id="previous-operand" class="previous-operand"></div>
                <div id="current-operand" class="current-operand">0</div>
            </div>
            <div class="buttons">
                <button class="span-two clear" onclick="calculator.clear()">AC</button>
                <button class="delete" onclick="calculator.delete()">DEL</button>
                <button class="operator" onclick="calculator.chooseOperation('÷')">÷</button>
                <button onclick="calculator.appendNumber('7')">7</button>
                <button onclick="calculator.appendNumber('8')">8</button>
                <button onclick="calculator.appendNumber('9')">9</button>
                <button class="operator" onclick="calculator.chooseOperation('*')">×</button>
                <button onclick="calculator.appendNumber('4')">4</button>
                <button onclick="calculator.appendNumber('5')">5</button>
                <button onclick="calculator.appendNumber('6')">6</button>
                <button class="operator" onclick="calculator.chooseOperation('-')">-</button>
                <button onclick="calculator.appendNumber('1')">1</button>
                <button onclick="calculator.appendNumber('2')">2</button>
                <button onclick="calculator.appendNumber('3')">3</button>
                <button class="operator" onclick="calculator.chooseOperation('+')">+</button>
                <button onclick="calculator.appendNumber('.')">.</button>
                <button onclick="calculator.appendNumber('0')">0</button>
                <button class="span-two equals" onclick="calculator.compute()">=</button>
            </div>
        </div>
    </div>

    <script src="script.js?v=x2y9z4"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js')
          .then(function (reg) { console.log('[PWA] SW registered:', reg.scope); })
          .catch(function (err) { console.warn('[PWA] SW registration failed:', err); });
      });
    }
  </script>
</body>
</html>
